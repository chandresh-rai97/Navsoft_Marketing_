<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101010" />
<title>Cadence · offline</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom));
    background: #F8F8F8; color: #1C1C1C; font: 16px/1.5 "Plus Jakarta Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #161616; color: #FFFFFF; } p { color: rgba(255,255,255,.64) !important; } }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { margin: 0 0 20px; color: #414042; }
  button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 7px; background: #005DE0; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You’re offline</h1>
    <p>Reconnect to see the latest data.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
