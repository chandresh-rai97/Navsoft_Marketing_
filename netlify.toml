[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side routing works on refresh / deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch the newest service worker so new deploys are picked up.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
